server:
  port: 8080

spring:
  application:
    name: ledger-os-backend

  datasource:
    url: jdbc:h2:file:./data/ledgerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

ledger:
  currency:
    default: INR
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
